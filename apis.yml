aid: boatsetter
name: Boatsetter
description: >-
  Boatsetter is a Fort Lauderdale, Florida founded and Miami headquartered
  peer-to-peer boat rental marketplace that connects boat owners with renters
  and with United States Coast Guard licensed captains. Founded in 2012, the
  platform lists more than 50,000 boats across 600 to 700 locations worldwide
  and 20,000 makes and models, spanning fishing boats, pontoons, sailboats,
  party boats, watersports vessels and luxury yacht charters, bookable either
  bareboat or with a captain. Boatsetter layers identity verification, an
  insurance program underwritten through its Buoy partnership, payments,
  messaging, calendar and pricing tools for owners, and trust and safety on
  top of owner supplied inventory, and takes a marketplace commission on each
  booking. The company also operates a separate Boatsetter Owner application
  for hosts, and in December 2025 announced a merger with Getmyboat to form a
  combined boat rental marketplace expected to process roughly 500 million
  dollars in bookings across 50 countries, with both platforms and apps
  continuing to operate. Boatsetter does not publish a public developer API,
  OpenAPI definition, SDK, developer portal, or partner API documentation; its
  only public GitHub presence is a single archived fork of a jQuery form
  serialization plugin, and its third party surface is limited to consumer
  facing partnerships (Airbnb) and an affiliate marketing program.
